<svg fill="none" viewBox="0 0 720 1520" width="720" height="1520" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        *{margin:0;padding:0;box-sizing:border-box}
        .root{
          background:#0a0e17;
          width:720px;
          height:1520px;
          padding:40px 36px 32px;
          font-family:'SF Mono','Cascadia Code','Fira Code','Menlo','Consolas',monospace;
          color:#e2e8f0;
          position:relative;
          overflow:hidden;
        }
        .grid-bg{
          position:absolute;inset:0;
          background-image:
            linear-gradient(rgba(30,41,59,.22) 1px,transparent 1px),
            linear-gradient(90deg,rgba(30,41,59,.22) 1px,transparent 1px);
          background-size:60px 60px;pointer-events:none;
        }
        .glow{
          position:absolute;top:-120px;right:-120px;width:400px;height:400px;border-radius:50%;
          background:radial-gradient(circle,rgba(34,211,238,.08),transparent 70%);pointer-events:none;
        }
        .content{position:relative;z-index:1}

        /* Header */
        .badge{
          display:inline-block;padding:3px 10px;border-radius:4px;
          font-size:10px;font-weight:600;color:#64748b;background:#1a2235;letter-spacing:.5px;margin-bottom:8px;
        }
        h1{font-size:42px;font-weight:700;letter-spacing:-1px;line-height:1.1;color:#e2e8f0}
        h1 .acc{color:#22d3ee}
        .tagline{
          font-size:14px;color:#94a3b8;line-height:1.6;max-width:560px;margin-top:12px;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        }
        .divider{
          height:1px;margin:28px 0;
          background:linear-gradient(90deg,rgba(34,211,238,.4),#1e293b,transparent);
        }

        /* Section titles */
        .section-title{display:flex;align-items:center;gap:7px;margin-bottom:12px}
        .section-title h3{
          font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#e2e8f0;
        }
        .section-title .icon{font-size:15px}

        /* Mode cards */
        .mode-card{
          background:#111827;border:1px solid #1e293b;border-radius:8px;
          padding:14px 16px;margin-bottom:12px;
        }
        .mode-card.disc{border-left:3px solid #22d3ee}
        .mode-card.work{border-left:3px solid #f59e0b}
        .mode-card.docs{border-left:3px solid #34d399}
        .mode-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
        .pill{
          display:inline-block;padding:2px 8px;border-radius:3px;
          font-size:10px;font-weight:600;letter-spacing:.5px;
        }
        .pill-cyan{color:#22d3ee;background:rgba(34,211,238,.12)}
        .pill-orange{color:#f59e0b;background:rgba(245,158,11,.12)}
        .pill-green{color:#34d399;background:rgba(52,211,153,.12)}
        .pill-red{color:#f87171;background:rgba(248,113,113,.12)}
        .mode-sub{font-size:10px;color:#64748b}

        .cmd-row{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid #1e293b}
        .cmd-row:last-child{border-bottom:none}
        .cmd-name{font-size:12px;font-weight:500;white-space:nowrap;min-width:120px}
        .c-cyan{color:#22d3ee}
        .c-orange{color:#f59e0b}
        .c-green{color:#34d399}
        .c-red{color:#f87171}
        .c-violet{color:#a78bfa}
        .cmd-desc{
          font-size:11px;color:#94a3b8;line-height:1.4;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        }

        /* Utility box */
        .utility-box{
          margin-bottom:28px;padding:12px 16px;
          background:#1a2235;border-radius:6px;border:1px solid #1e293b;
        }
        .utility-label{
          font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;
        }

        /* Spacer */
        .spacer{margin-bottom:28px}

        /* Safety hooks */
        .hooks{display:flex;gap:12px;margin-bottom:28px}
        .hook{
          flex:1;background:#111827;border:1px solid #1e293b;border-radius:7px;padding:14px 16px;
        }
        .hook-hdr{display:flex;align-items:center;gap:7px;margin-bottom:6px}
        .hook-hdr .code{font-size:13px;font-weight:600}
        .hook p{
          font-size:11px;color:#94a3b8;line-height:1.5;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        }

        /* KB */
        .kb-box{
          background:#111827;border:1px solid #1e293b;border-radius:7px;
          padding:16px 18px;position:relative;overflow:hidden;margin-bottom:28px;
        }
        .kb-glow{
          position:absolute;top:0;right:0;width:120px;height:120px;
          background:radial-gradient(circle at top right,rgba(52,211,153,.08),transparent 70%);pointer-events:none;
        }
        .tree{font-size:12px;line-height:1.8;color:#64748b}
        .tree .dir{color:#34d399}
        .tree .file{color:#94a3b8}
        .kb-note{
          font-size:11px;color:#94a3b8;line-height:1.55;margin-top:12px;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        }
        .kb-note .em{color:#34d399}

        /* Databases */
        .db-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
        .db-card{
          flex:1 1 110px;background:#111827;border:1px solid #1e293b;border-radius:7px;
          padding:12px 10px;text-align:center;
        }
        .db-icon{font-size:17px;margin-bottom:3px}
        .db-name{font-size:12px;font-weight:700;color:#e2e8f0;margin-bottom:3px}
        .db-note{
          font-size:9px;color:#64748b;line-height:1.3;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        }

        /* Architecture */
        .arch{display:flex;align-items:center;justify-content:center;gap:0;padding:10px 0}
        .arch-box{
          background:#1a2235;border:1px solid #1e293b;border-radius:5px;
          padding:10px 18px;text-align:center;
        }
        .arch-label{font-size:11px;font-weight:700;margin-bottom:2px}
        .arch-sub{font-size:8px;color:#64748b}
        .arch-arrow{
          width:28px;height:2px;
          background:linear-gradient(90deg,#1e293b,#64748b);
          position:relative;flex-shrink:0;
        }
        .arch-arrow-head{
          position:absolute;right:-3px;top:-4px;width:0;height:0;
          border-left:6px solid #64748b;border-top:5px solid transparent;border-bottom:5px solid transparent;
        }

        /* Footer */
        .footer{
          padding:12px 0;border-top:1px solid #1e293b;display:flex;
          justify-content:space-between;font-size:9px;color:#64748b;
        }
      </style>

      <div class="root">
        <div class="grid-bg"></div>
        <div class="glow"></div>

        <div class="content">
          <!-- Header -->
          <div style="margin-bottom:28px">
            <div class="badge">CLAUDE CODE EXTENSION</div>
            <h1>Analyst<span class="acc">OS</span></h1>
            <p class="tagline">A senior data engineer assistant that already knows the database, remembers every question asked, and drafts queries without being asked twice.</p>
          </div>
          <div class="divider"></div>

          <!-- Three Modes -->
          <div class="spacer">
            <div class="section-title"><span class="icon">⬡</span><h3>Three Modes of Work</h3></div>

            <div class="mode-card disc">
              <div class="mode-hdr"><span class="pill pill-cyan">DISCOVERY</span><span class="mode-sub">Learn an unfamiliar database</span></div>
              <div class="cmd-row"><span class="cmd-name c-cyan">/db-orient</span><span class="cmd-desc">Schema overview — entities, relationships, key tables</span></div>
              <div class="cmd-row"><span class="cmd-name c-cyan">/db-explain</span><span class="cmd-desc">Plain-English explanation of any table or column</span></div>
              <div class="cmd-row"><span class="cmd-name c-cyan">/db-profile</span><span class="cmd-desc">Row counts, null rates, distinct values, distributions</span></div>
            </div>

            <div class="mode-card work">
              <div class="mode-hdr"><span class="pill pill-orange">WORK</span><span class="mode-sub">Write and validate queries</span></div>
              <div class="cmd-row"><span class="cmd-name c-orange">/db-query</span><span class="cmd-desc">Natural language → dialect-correct, cost-checked SQL</span></div>
              <div class="cmd-row"><span class="cmd-name c-orange">/db-joins</span><span class="cmd-desc">Join paths, cardinality checks, fan-out risk flags</span></div>
              <div class="cmd-row"><span class="cmd-name c-orange">/db-gotchas</span><span class="cmd-desc">Surface known traps: soft deletes, encodings, etc.</span></div>
            </div>

            <div class="mode-card docs">
              <div class="mode-hdr"><span class="pill pill-green">DOCUMENTATION</span><span class="mode-sub">Capture what you've learned</span></div>
              <div class="cmd-row"><span class="cmd-name c-green">/db-document</span><span class="cmd-desc">Draft or update a data dictionary entry</span></div>
              <div class="cmd-row"><span class="cmd-name c-green">/db-capture</span><span class="cmd-desc">Save a query + context as a canonical example</span></div>
              <div class="cmd-row"><span class="cmd-name c-green">/db-index</span><span class="cmd-desc">View and manage knowledge base inventory</span></div>
            </div>

            <!-- Utility -->
            <div class="utility-box">
              <div class="utility-label">Utility</div>
              <div class="cmd-row"><span class="cmd-name c-violet">/db-status</span><span class="cmd-desc">Active connection and KB inventory</span></div>
              <div class="cmd-row"><span class="cmd-name c-violet">/db-use</span><span class="cmd-desc">Switch database connection</span></div>
            </div>
          </div>

          <!-- Safety Hooks -->
          <div class="section-title"><span class="icon">⛨</span><h3>Safety Hooks</h3></div>
          <div class="hooks">
            <div class="hook">
              <div class="hook-hdr">
                <span>🛡</span>
                <span class="code c-red">db-safety</span>
                <span class="pill pill-red">AUTO</span>
              </div>
              <p>Blocks DDL/DML (DROP, DELETE, INSERT…) before execution. Explicit override required.</p>
            </div>
            <div class="hook">
              <div class="hook-hdr">
                <span>⚡</span>
                <span class="code c-orange">db-cost-gate</span>
                <span class="pill pill-orange">AUTO</span>
              </div>
              <p>Flags expensive queries — full scans, missing partition filters — before they run.</p>
            </div>
          </div>

          <!-- Knowledge Base -->
          <div class="section-title"><span class="icon">📂</span><h3>Compounding Knowledge Base</h3></div>
          <div class="kb-box">
            <div class="kb-glow"></div>
            <div class="tree">
              <span class="dir">db-knowledge/</span><br/>
              ├── <span class="file">_schema-overview.md</span><br/>
              ├── <span class="file">_session-context.md</span><br/>
              ├── <span class="file">orders.md</span><br/>
              ├── <span class="file">customers.md</span><br/>
              └── <span class="file">…one file per table</span>
            </div>
            <p class="kb-note">Plain markdown, git-versioned, team-shared. Claude reads it at session start. The knowledge base is the durable product — <span class="em">Claude is the tool that builds it</span>.</p>
          </div>

          <!-- Databases -->
          <div class="section-title"><span class="icon">⬢</span><h3>Supported Databases</h3></div>
          <div class="db-grid">
            <div class="db-card"><div class="db-icon">◇</div><div class="db-name">SQLite</div><div class="db-note">Bundled demo</div></div>
            <div class="db-card"><div class="db-icon">◆</div><div class="db-name">Oracle</div><div class="db-note">EXPLAIN PLAN</div></div>
            <div class="db-card"><div class="db-icon">❄</div><div class="db-name">Snowflake</div><div class="db-note">Bytes-scanned</div></div>
            <div class="db-card"><div class="db-icon">△</div><div class="db-name">Athena</div><div class="db-note">Partition filters</div></div>
            <div class="db-card"><div class="db-icon">☁</div><div class="db-name">Salesforce</div><div class="db-note">SOQL / governor</div></div>
          </div>

          <!-- Architecture -->
          <div class="section-title"><span class="icon">◈</span><h3>Architecture</h3></div>
          <div class="arch">
            <div class="arch-box"><div class="arch-label c-cyan">Analyst</div><div class="arch-sub">Slash commands</div></div>
            <div class="arch-arrow"><div class="arch-arrow-head"></div></div>
            <div class="arch-box"><div class="arch-label c-violet">Claude Code</div><div class="arch-sub">Skills + Hooks</div></div>
            <div class="arch-arrow"><div class="arch-arrow-head"></div></div>
            <div class="arch-box"><div class="arch-label c-orange">Database</div><div class="arch-sub">Read-only queries</div></div>
            <div class="arch-arrow"><div class="arch-arrow-head"></div></div>
            <div class="arch-box"><div class="arch-label c-green">Knowledge Base</div><div class="arch-sub">db-knowledge/</div></div>
          </div>

          <!-- Footer -->
          <div class="footer">
            <span>Read-only by default · Cost-gated · Git-versioned knowledge</span>
            <span>AnalystOS v1</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
