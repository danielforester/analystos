# DB Analyst Framework — Connection Profiles
# Copy this file to .claude/db-connections/active.yaml and fill in your values.
# active.yaml is gitignored — never commit credentials.
#
# Reference environment variables for all secrets; never paste passwords here.
# Set env vars in your shell profile or a .env file (also gitignored).

# ── Active connection ────────────────────────────────────────────────────────
# Set this to the `name` of whichever connection below you want Claude to use.
active: demo

# ── Connection profiles ──────────────────────────────────────────────────────
connections:

  # ---------------------------------------------------------------------------
  # SQLite — local file database, no credentials required
  # Great for demos and testing the framework without cloud access.
  # ---------------------------------------------------------------------------
  - name: demo
    type: sqlite
    display_name: "AnalystOS Demo Database"
    read_only: true               # SQLite connections open in read-only mode

    # ── Transport ────────────────────────────────────────────────────────────────
    # direct (default) — skills run queries via Bash (Python sqlite3 module).
    # mcp              — skills call an MCP server instead of Bash. Set mcp_server below.
    #                    Tool names are constructed as: mcp__{mcp_server}__{tool}
    #                    e.g. mcp__sqlite__read_query, mcp__sqlite__list_tables
    transport: direct
    # mcp_server: sqlite          # MCP server name as registered in Claude Code.
    #                             # For the official SQLite MCP server this is typically "sqlite".

    sqlite:
      path: ./demo/demo.db        # Relative to the project root, or use absolute path

    # SQLite has no network cost — thresholds are not applicable.
    cost_thresholds: ~

  # ---------------------------------------------------------------------------
  # Oracle — on-prem or Oracle Cloud (python-oracledb, thin mode by default)
  # Run queries via: python scripts/oracle_connect.py --query "..." --format csv
  # ---------------------------------------------------------------------------
  - name: oracle-prod
    type: oracle
    display_name: "Production Oracle"
    read_only: true
    transport: direct               # Use the oracle_connect.py wrapper script

    oracle:
      host: db.example.com
      port: 1521
      service_name: ORCL           # preferred; or use sid: for legacy instances
      auth_mode: password          # Options: password | wallet | tns

      # ── password mode (standard on-prem) ──────────────────────────────────
      user_env: ORACLE_USER        # env var holding the username
      password_env: ORACLE_PASSWORD  # env var holding the password

      # ── wallet mode (Oracle Cloud Autonomous DB / mTLS) ───────────────────
      # auth_mode: wallet
      # wallet_location: /path/to/wallet   # directory containing cwallet.sso / ewallet.p12
      # wallet_password_env: ORACLE_WALLET_PASSWORD   # omit if wallet has no password

      # ── tns mode (centralised tnsnames.ora on-prem) ───────────────────────
      # auth_mode: tns
      # tns_alias: MY_DB_ALIAS             # alias from tnsnames.ora
      # tns_admin_env: TNS_ADMIN           # env var pointing to tnsnames.ora directory

      schema_scope:                # Limit introspection to these schemas (empty = all accessible)
        - SALES
        - HR
      fetch_size: 1000             # Rows per network round-trip (tune for performance)
      thick_mode: false            # true requires Oracle Instant Client on PATH

    cost_thresholds:
      warn_rows: 5000000           # Warn when EXPLAIN PLAN estimates > 5M rows

  # ---------------------------------------------------------------------------
  # AWS Athena — serverless SQL over S3
  # Run queries via: python scripts/athena_connect.py --query "..." --format csv
  # ---------------------------------------------------------------------------
  - name: awsathena
    type: athena
    display_name: "AWS Athena"
    read_only: true
    transport: direct               # Use the athena_connect.py wrapper script

    athena:
      region: us-east-1
      database: analytics           # Default Glue/Athena database
      s3_output_location: s3://my-bucket/athena-results/
      workgroup: primary            # Athena workgroup (controls per-query data limits)
      timeout_seconds: 300          # Max seconds to wait for query completion

      aws:
        # ── Auth mode ────────────────────────────────────────────────────────
        # profile  — named profile in ~/.aws/config (supports SSO/IAM Identity Center)
        #            Run once to authenticate: aws sso login --profile <profile_name>
        # keys     — static key/secret via environment variables (service accounts)
        # env      — boto3 default chain: env vars → ~/.aws/credentials → instance role
        auth: profile
        profile_name: my-sso-profile

        # For keys mode, uncomment and set the env var names holding your credentials:
        # auth: keys
        # access_key_id_env: AWS_ACCESS_KEY_ID
        # secret_access_key_env: AWS_SECRET_ACCESS_KEY

        # For env/instance-role mode (EC2, Lambda, ECS, GitHub Actions OIDC, etc.):
        # auth: env

    cost_thresholds:
      warn_bytes: 1073741824       # Warn when EXPLAIN estimates > 1 GB scanned (1 * 1024^3)
      # Athena charges ~$5/TB scanned. 1 GB = ~$0.005.

  # ---------------------------------------------------------------------------
  # Snowflake — cloud data warehouse
  # Run queries via: python scripts/snowflake_connect.py --query "..." --format csv
  # ---------------------------------------------------------------------------
  - name: snowflake-dw
    type: snowflake
    display_name: "Data Warehouse (Snowflake)"
    read_only: true

    transport: direct               # Use the snowflake_connect.py wrapper script
    # transport: mcp                # Or route through the official Snowflake MCP server
    # mcp_server: snowflake         # MCP server name (tool names: mcp__snowflake__execute_query, etc.)

    snowflake:
      account: myorg-myaccount      # Account identifier: <org>-<account> or <account>.<region>
      warehouse: ANALYST_WH         # Virtual warehouse to use for queries
      database: ANALYTICS           # Default database
      schema: PUBLIC                # Default schema (can be overridden per query)
      role: ANALYST                 # Snowflake role to assume (controls what objects are visible)

      # ── Auth mode ────────────────────────────────────────────────────────────
      # password — user + password from env vars (most common for interactive use)
      # keypair  — JWT via PEM private key; no browser, best for CI/CD / service accounts
      # sso      — externalbrowser; opens a browser tab for SAML/OAuth SSO login
      # oauth    — pre-obtained OAuth token from env var (external IdP / service accounts)
      auth_mode: password

      # ── password mode ────────────────────────────────────────────────────────
      user_env: SNOWFLAKE_USER        # env var holding the username
      password_env: SNOWFLAKE_PASSWORD  # env var holding the password

      # ── keypair mode (no browser; great for automation) ───────────────────────
      # auth_mode: keypair
      # user_env: SNOWFLAKE_USER
      # private_key_path_env: SNOWFLAKE_PRIVATE_KEY_PATH     # env var holding path to PEM file
      # private_key_passphrase_env: SNOWFLAKE_KEY_PASSPHRASE # omit if key is unencrypted

      # ── sso mode (opens browser tab) ─────────────────────────────────────────
      # auth_mode: sso
      # user_env: SNOWFLAKE_USER
      # login_timeout: 60            # seconds to wait for browser login (default 60)

      # ── oauth mode (pre-obtained token) ──────────────────────────────────────
      # auth_mode: oauth
      # user_env: SNOWFLAKE_USER
      # token_env: SNOWFLAKE_OAUTH_TOKEN   # env var holding the bearer token

      fetch_size: 1000              # Rows per network round-trip (tune for performance)

    cost_thresholds:
      warn_bytes: 10737418240       # Warn when EXPLAIN estimates > 10 GB scanned (10 * 1024^3)
      warn_rows: 10000000           # Warn when source table has > 10M rows (fallback proxy)
      # Snowflake cost = warehouse credits per second. Larger warehouses burn faster.
      # XSMALL: 1 credit/hr. LARGE: 8 credits/hr. Check your org's credit rate.
      # EXPLAIN USING TABULAR provides bytesAssigned as the primary cost signal.

  # ---------------------------------------------------------------------------
  # Salesforce — CRM and business object platform (SOQL, not SQL)
  # ---------------------------------------------------------------------------
  - name: salesforce-prod
    type: salesforce
    display_name: "Salesforce Production"
    read_only: true

    # transport: direct           # Salesforce uses REST API calls, not Bash — treat as direct.
    # mcp_server:                 # (leave blank for Salesforce)

    salesforce:
      instance_url_env: SF_INSTANCE_URL     # e.g. https://myorg.my.salesforce.com
      api_version: "59.0"                   # Salesforce API version (update to latest stable)
      # Auth option A — OAuth 2.0 client credentials (preferred for integrations):
      client_id_env: SF_CLIENT_ID
      client_secret_env: SF_CLIENT_SECRET
      # Auth option B — username/password + security token (simpler for single-user scripts):
      # username_env: SF_USERNAME
      # password_env: SF_PASSWORD           # Append security token to password value
      # Auth option C — access token (for short-lived sessions):
      # access_token_env: SF_ACCESS_TOKEN

    cost_thresholds:
      warn_records: 40000           # Warn when COUNT() estimate > 40k (synchronous limit is 50k)
      # Exceeding 50,000 rows in a synchronous SOQL query causes a hard QUERY_ROW_LIMIT_EXCEEDED error.
      # warn_records should be set below 50,000 to give the analyst a chance to add filters.
